name: Build Track & Field Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android/kotlin-native
    paths:
      - 'track-and-field/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: track-and-field-android-apk
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compile debug APK
        run: gradle -p track-and-field :app:assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: track-and-field-debug-apk
          path: track-and-field/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
